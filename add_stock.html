{% extends "base.html" %}

{% block content %}
<h2><p style="color:green;">Add a Stock:</p></h2>
<form method="post">
  <p style="color:blue;">
  <label for="stockSymbol">Stock Symbol <em>(required, 1-5 uppercase letters)</em></label>       <!-- Updated! -->
  <input type="text" id="stockSymbol" name="stock_symbol" required pattern="[A-Z]{1,5}" />       <!-- Updated! -->
  <br>
  <label for="numberOfShares">Number of Shares <em>(required)</em></label>                       <!-- Updated! -->
  <input type="text" id="numberOfShares" name="number_of_shares" required />                     <!-- Updated! -->
  <br>
  <label for="purchasePrice">Purchase Price ($) <em>(required)</em></label>                      <!-- Updated! -->
  <input type="text" id="purchasePrice" name="purchase_price" placeholder="$300.00" required />  <!-- Updated! -->
  </p>
  <br>
  <input type="submit" value="Submit" style="background-color: green; color: yellow;">
</form>
{% endblock %}
